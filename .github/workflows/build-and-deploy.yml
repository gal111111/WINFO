name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The enquiry form posts to the Cloudflare Pages Function in functions/api/enquiry.js,
      # so the endpoint must be baked in at build time.
      - name: Build
        run: npm run build
        env:
          VITE_ENQUIRY_ENDPOINT: /api/enquiry
      # Requires CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID
      # in the repository secrets. Runtime secrets such as RESEND_API_KEY stay in the
      # Cloudflare Pages project settings, not in this repository.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=winfo-website
